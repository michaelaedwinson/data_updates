title: GNSS jamming affecting glider surface locations
content: Starting May 2025, several glider missions in the Baltic sea have been affected by GNSS jamming. The issue display as incorrect surface locations several hundred kilometers off transect, no GNSS fix and/or incorrect timestamps. For more information, download the report <a href="https://observations.voiceoftheocean.org/static/img/reports/Quality_Issue_6_gnss_jamming.pdf">https://observations.voiceoftheocean.org/static/img/reports/Quality_Issue_6_gnss_jamming.pdf</a>
date: "2026-05-29"
