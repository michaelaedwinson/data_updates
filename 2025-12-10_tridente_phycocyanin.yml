title: Tridente Phycocyanin data lag and abnormally high values
content: The phycocyanin data of the RBR Tridente is displaying lag between up- and downcast on the majority of missions connected to an effect of temperature. Some missions also display abnormally high values connected to an calibration error. For more information, download the report <a href="https://observations.voiceoftheocean.org/static/img/reports/Quality_Issue_5_tridente_phycocyanin.pdf">https://observations.voiceoftheocean.org/static/img/reports/Quality_Issue_5_tridente_phycocyanin.pdf</a>
date: "2025-12-10"
